# kiberportal-warp-dns: geohide
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

hosts:
  dns.google: [8.8.8.8, 8.8.4.4]
  common.dns.yandex.net: [77.88.8.8, 77.88.8.1]

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  prefer-h3: false
  use-hosts: true
  cache-algorithm: arc
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.stun.*"
    - "+.stun.*.*"
    - "+.push.apple.com"

  default-nameserver:
    - 45.155.204.190
    - 37.230.192.51
    - 95.182.120.241

  nameserver:
    - https://dns.geohide.ru:444/dns-query

  proxy-server-nameserver:
    - https://dns.geohide.ru:444/dns-query

  nameserver-policy:
    "+.ru,+.su,+.xn--p1ai,rule-set:category-ru,rule-set:whitelist,rule-set:private-domains":
      - 62.76.62.76
      - 77.88.8.8
    "+.gitverse.ru,+.gidroksi.fun,+.cyb-portal.org":
      - 62.76.62.76
      - 77.88.8.8
    "+.openai.com,+.chatgpt.com,+.oaistatic.com,+.oaiusercontent.com,+.claude.ai,+.claude.com,+.claudeusercontent.com,+.anthropic.com,+.perplexity.ai,+.x.ai,+.grok.com,+.suno.com,+.gemini.google.com,+.aistudio.google.com,+.generativelanguage.googleapis.com":
      - https://dns.quad9.net/dns-query
      - https://dns.adguard-dns.com/dns-query
    "+.telegram.org,+.t.me,+.telegram.me,+.telegram.dog,+.telegra.ph,+.telesco.pe,+.tg.dev,+.discord.com,+.discordapp.com,+.discord.gg,+.discordapp.net,+.discord.media":
      - https://dns.quad9.net/dns-query
      - https://dns.adguard-dns.com/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  sniff:
    HTTP:
      ports: [80, "8080-8880"]
    TLS:
      ports: [443, 8443]

msq: &msq
