  private-key: MHcCAQEEIE8RsKH/2gwsGUbcrTCRaaH6JllTCRFXq+WZf7z0/LtuoAoGCCqGSM49AwEHoUQDQgAE4RUR3IFwpjVlUhJGxGAGbZiaQqHwoTJbpsDk9m5wMu7hQ4sMtPtBLApLS1NpIyNZRp0aG8thz8zEROMDVODjrg==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2/32
  ipv6: 2606:4700:110:83e7:2313:509e:3e6b:39a2/128
