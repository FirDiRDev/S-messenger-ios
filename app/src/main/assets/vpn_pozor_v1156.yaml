proxy-groups:

- name: РЕЖИМ
  type: select
  proxies:
    - АВТО
    - РУЧНОЙ

- name: АВТО
  type: fallback
  url: http://www.msftconnecttest.com/connecttest.txt
  expected-status: 200
  interval: 300
  timeout: 3500
  max-failed-times: 2
  lazy: false
  interrupt-exist-connections: true
  proxies:
    - Инно
    - WARP
    - Каскад
    - RU
    - "РЕЗЕРВ (Reality, впиши свой VPS)"

- name: ИИ
  hidden: true
  type: fallback
  url: https://api.openai.com/v1/models
  expected-status: 200/401
  interval: 300
  timeout: 5000
  max-failed-times: 2
  lazy: false
  interrupt-exist-connections: true
  proxies:
    - Инно
    - WARP
    - Каскад

- name: ИИ-чистые
  hidden: true
  type: url-test
  proxies: [REJECT]
  use: [inno-sub6, inno-sub10, sub6, sub10]
  filter: '(?i)\[INNO|Каскад|➜'
  url: https://api.openai.com/v1/models
  expected-status: 200/401
  interval: 3600
  tolerance: 200
  timeout: 5000
  max-failed-times: 2
  lazy: true

- name: ЗАГРУЗКА
  hidden: true
  type: fallback
  url: http://www.msftconnecttest.com/connecttest.txt
  expected-status: 200
  interval: 600
  timeout: 4000
  max-failed-times: 1
  lazy: true
  proxies:
    - Инно
    - Каскад
    - WARP
    - RU
    - DIRECT

- name: РУЧНОЙ
  type: select
  proxies:
    - Инно
    - Каскад
    - WARP
    - RU
    - "РЕЗЕРВ (Reality, впиши свой VPS)"
    - Cyber БС
    - Mifa ЧС
    - Gidroksi ЧС
    - PZD БС
    - Aetris БС
    - Aetris ЧС
    - ZIENG БС
    - Igareck БС
    - SLX БС

- name: Инно
  type: url-test
  proxies: [REJECT]
  use: [sub1, sub2, sub4, sub6, sub7, sub10, sub11, igareck-cidr, igareck-mobile]
  filter: *good
  exclude-filter: *rucasc
  url: http://www.msftconnecttest.com/connecttest.txt
  expected-status: 200
  interval: 600
  tolerance: 100
  timeout: 3500
  max-failed-times: 2
  lazy: false
  interrupt-exist-connections: true

- name: ВХОД РУ
  hidden: true
  type: url-test
  proxies: [REJECT]
  use: [sub4, sub6, sub7, sub9, sub10, sub11, igareck-cidr, igareck-mobile, slxkware]
  filter: *ruentry
  exclude-filter: '(?i)Каскад|➜'
  url: http://ya.ru
  expected-status: 200/301/302
  interval: 900
  tolerance: 150
  timeout: 1800
  max-failed-times: 2
  lazy: false

- name: Каскад
  type: url-test
  proxies: [REJECT]
  use: [inno-sub6, inno-sub4, inno-sub10, sub6, sub4, sub10]
  filter: '(?i)\[INNO|Каскад|➜'
  url: http://www.msftconnecttest.com/connecttest.txt
  expected-status: 200
  interval: 600
  tolerance: 120
  timeout: 3500
  max-failed-times: 2
  lazy: false
  interrupt-exist-connections: true

- name: WARP
  type: url-test
  use: [warp-local]
  url: http://www.msftconnecttest.com/connecttest.txt
  expected-status: 200
