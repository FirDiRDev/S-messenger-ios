<style>
.w{display:flex;align-items:center;gap:14px}
canvas{width:132px;height:132px;flex:none}
.inf b{display:block;font:700 30px/1 ui-monospace,Roboto,monospace;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.inf b s{text-decoration:none;opacity:.5;font-size:20px}
.inf small{display:block;color:#94a3b8;font-size:12.5px;margin-top:6px}
.zs{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.zs div{display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;gap:10px}
.zs span{color:#64748b}
</style>
<div class=w><canvas id=c></canvas><div class=inf><b id=t>--:--</b><small id=d></small><div class=zs id=zs></div></div></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1,S=132;c.width=S*dpr;c.height=S*dpr;x.scale(dpr,dpr);
var Z=pl('zones',[['Лондон','0'],['Москва','3'],['Токио','9']]).slice(0,4).map(function(z){return [z[0],parseFloat(z[1])||0]});
var zs=document.getElementById('zs');Z.forEach(function(z){var e=document.createElement('div');e.innerHTML='<span>'+H(z[0])+'</span><b style="font-size:12px;font-weight:600"></b>';zs.appendChild(e)});
var M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],D=['вс','пн','вт','ср','чт','пт','сб'];
function hand(a,l,w,col){x.save();x.rotate(a);x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(0,l*.18);x.lineTo(0,-l);x.stroke();x.restore()}
var last=-1;function p2(n){return('0'+n).slice(-2)}
function draw(){var n=new Date(),ms=n.getMilliseconds(),s=n.getSeconds()+ms/1000,m=n.getMinutes()+s/60,h=n.getHours()%12+m/60,r=S/2;
 x.clearRect(0,0,S,S);x.save();x.translate(r,r);
 var g=x.createRadialGradient(-20,-24,10,0,0,r);g.addColorStop(0,'#2e2a5a');g.addColorStop(1,'#141228');x.fillStyle=g;x.beginPath();x.arc(0,0,r-3,0,7);x.fill();
 x.strokeStyle='rgba(129,140,248,.5)';x.lineWidth=2;x.stroke();
 for(var i=0;i<60;i++){x.save();x.rotate(i*Math.PI/30);x.strokeStyle=i%5?'rgba(255,255,255,.18)':'rgba(255,255,255,.7)';x.lineWidth=i%5?1:2.2;x.beginPath();x.moveTo(0,-(r-8));x.lineTo(0,-(r-(i%5?12:16)));x.stroke();x.restore()}
 hand(h*Math.PI/6,r*.5,4.5,'#e0e7ff');hand(m*Math.PI/30,r*.72,3,'#c7d2fe');
 // секундная - плавно, с лёгкой «пружинкой» на каждом шаге
 var sec=Math.floor(s),f=s-sec,u=Math.min(1,f/.22),c1=2.2,e=1+(c1+1)*Math.pow(u-1,3)+c1*Math.pow(u-1,2),sa=(sec-1+e)*Math.PI/30;
 hand(sa,r*.8,1.6,'#f43f5e');x.fillStyle='#f43f5e';x.beginPath();x.arc(0,0,4,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(0,0,1.6,0,7);x.fill();x.restore();
 if(n.getSeconds()!==last){last=n.getSeconds();document.getElementById('t').innerHTML=p2(n.getHours())+':'+p2(n.getMinutes())+'<s>:'+p2(n.getSeconds())+'</s>';
 document.getElementById('d').textContent=D[n.getDay()]+', '+n.getDate()+' '+M[n.getMonth()];
 var u=n.getTime()+n.getTimezoneOffset()*60000;Z.forEach(function(z,i){var t=new Date(u+z[1]*3600000);zs.children[i].querySelector('b').textContent=p2(t.getHours())+':'+p2(t.getMinutes())})}
 requestAnimationFrame(draw)}
draw();
})();
</script>
