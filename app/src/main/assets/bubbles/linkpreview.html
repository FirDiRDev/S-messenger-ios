<style>
.u{font-size:13px;color:#60a5fa;margin-bottom:8px;word-break:break-all}
.c{border-left:3px solid #3b82f6;border-radius:4px 12px 12px 4px;background:rgba(59,130,246,.08);padding:9px 10px;position:relative;overflow:hidden}
.sk{background:rgba(255,255,255,.08);border-radius:6px;position:relative;overflow:hidden}
.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);animation:sh 1.1s ease-in-out infinite}
@keyframes sh{to{transform:translateX(100%)}}
.l1{height:11px;width:40%}.l2{height:14px;width:85%;margin-top:7px}.l3{height:10px;width:95%;margin-top:7px}.l4{height:10px;width:70%;margin-top:5px}.im{height:120px;margin-top:9px;border-radius:10px}
.real{display:none}
.ld .skel{display:none}.ld .real{display:block;animation:in .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.site{font-size:12px;color:#60a5fa;font-weight:700}
.tt{font-size:14px;font-weight:700;margin-top:3px}
.ds{font-size:12.5px;color:#cbd5e1;margin-top:3px;line-height:1.35}
.pic{height:120px;margin-top:9px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#22d3ee55,transparent 50%),radial-gradient(circle at 75% 70%,#a855f755,transparent 55%),linear-gradient(135deg,#1e1b4b,#312e81);display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden}
.pic span{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-4deg)}}
.rl{border:0;border-radius:10px;padding:5px 10px;font:600 12px sans-serif;color:#fff;background:rgba(255,255,255,.1);margin-top:8px}
</style>
<div class=u id=u>https://smessenger.app/blog/p2p</div>
<div class=c id=c>
<div class=skel><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div><div class="sk l4"></div><div class="sk im"></div></div>
<div class=real><div class=site id=si>S-messenger · Блог</div><div class=tt id=ti>Мессенджер без серверов: как это работает</div><div class=ds id=de>Прямые зашифрованные соединения между телефонами, узлы сети, обход блокировок - простыми словами.</div><div class=pic id=pc><span>🛰</span></div></div>
</div>
<button class=rl id=rl>↻ Загрузить снова</button>
<script>
(function(){var c=document.getElementById('c'),U=pv('url','');if(U){document.getElementById('u').textContent=U;document.getElementById('c').onclick=function(){go(U)}}
[['si','site'],['ti','title'],['de','desc']].forEach(function(k){var v=pv(k[1],'');if(v)document.getElementById(k[0]).textContent=v});
var IM=pv('img','');if(/^https:\/\//.test(IM)){var pc=document.getElementById('pc');pc.innerHTML='';pc.style.background='#111 center/cover no-repeat url("'+IM.replace(/["()\\]/g,'')+'")'}
function load(){c.className='c';setTimeout(function(){c.className='c ld'},1600)}document.getElementById('rl').onclick=load;load()})();
</script>
