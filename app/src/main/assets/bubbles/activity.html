<style>
.w{display:flex;align-items:center;gap:14px}
svg{width:128px;height:128px;flex:none;transform:rotate(-90deg)}
circle{fill:none;stroke-linecap:round}
.bg{stroke-opacity:.18}
.rg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.9,.25,1)}
.ls{flex:1}
.it{margin-bottom:8px}
.it small{font-size:11.5px;color:#94a3b8;display:block}
.it b{font-size:17px;font-variant-numeric:tabular-nums}
.it b span{font-size:12px;color:#94a3b8;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd b{font-size:15px}
.rp{border:0;border-radius:10px;padding:4px 9px;font:600 12px sans-serif;color:#fff;background:rgba(255,255,255,.1)}
.days{display:flex;gap:6px;justify-content:space-between;margin-top:6px}
.days div{flex:1;text-align:center;font-size:10.5px;color:#64748b}
.days i{display:block;height:28px;border-radius:6px;margin-bottom:3px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.days i:after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:linear-gradient(#f43f5e,#fb923c);border-radius:6px;transform:scaleY(0);transform-origin:bottom;transition:transform .8s cubic-bezier(.3,1.4,.5,1) var(--d)}
.go .days i:after{transform:scaleY(1)}
</style>
<div id=w>
<div class=hd><b id=hd>🏃 Активность сегодня</b><button class=rp id=rp>↻</button></div>
<div class=w><svg viewBox="0 0 128 128" id=sv></svg><div class=ls id=ls></div></div>
<div class=days id=days></div>
</div>
<script>
(function(){
document.getElementById('hd').textContent=pv('head','🏃 Активность сегодня');var CL=['#f43f5e','#a3e635','#22d3ee'];
var R=pl('rings',[['Движение','540','700','ккал'],['Упражнения','38','30','мин'],['Разминка','9','12','ч']]).slice(0,3).map(function(r,i){return [r[0],parseFloat(r[1])||0,Math.max(1,parseFloat(r[2])||1),r[3]||'',CL[i]]});
var sv=document.getElementById('sv'),ls=document.getElementById('ls'),NS='http://www.w3.org/2000/svg',rings=[];
R.forEach(function(r,i){var rad=56-i*16,len=2*Math.PI*rad;
 [0,1].forEach(function(k){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',64);c.setAttribute('cy',64);c.setAttribute('r',rad);c.setAttribute('stroke',r[4]);c.setAttribute('stroke-width',13);
  if(!k)c.setAttribute('class','bg');else{c.setAttribute('class','rg');c.style.strokeDasharray=len;c.style.strokeDashoffset=len;c.style.transitionDelay=(i*.15)+'s';rings.push([c,len,Math.min(1,r[1]/r[2])]);c.style.filter='drop-shadow(0 0 4px '+r[4]+')'}sv.appendChild(c)});
 var d=document.createElement('div');d.className='it';d.innerHTML='<small>'+H(r[0])+'</small><b style="color:'+r[4]+'"><n>0</n><span> / '+r[2]+' '+H(r[3])+'</span></b>';ls.appendChild(d)});
var days=document.getElementById('days'),DN=['пн','вт','ср','чт','пт','сб','вс'],DV=[.6,.9,.45,1,.75,.3,.8];
DN.forEach(function(n,i){var d=document.createElement('div');d.innerHTML='<i style="--h:'+(DV[i]*100)+'%;--d:'+(i*.06)+'s"></i>'+n;days.appendChild(d)});
function count(el,to,ms){var t0=performance.now();(function f(now){var k=Math.min(1,(now-t0)/ms);k=1-Math.pow(1-k,3);el.textContent=to%1?(to*k).toFixed(1):Math.round(to*k);if(k<1)requestAnimationFrame(f)})(t0)}
function go(){var w=document.getElementById('w');w.className='';rings.forEach(function(r){r[0].style.transition='none';r[0].style.strokeDashoffset=r[1]});void sv.getBoundingClientRect();
 requestAnimationFrame(function(){w.className='go';rings.forEach(function(r){r[0].style.transition='';r[0].style.strokeDashoffset=r[1]*(1-r[2])});[].forEach.call(ls.querySelectorAll('n'),function(n,i){count(n,R[i][1],1500)})})}
document.getElementById('rp').onclick=go;setTimeout(go,250);
})();
</script>
