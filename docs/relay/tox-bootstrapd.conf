// Конфиг своего узла/релея для StoykoMessenger (tox-bootstrapd из c-toxcore).
// Ставится на VPS: apt install tox-bootstrapd  (или собрать из github.com/TokTok/c-toxcore)
// Публичный ключ узла после запуска: journalctl -u tox-bootstrapd | grep "Public Key"

port = 33445
keys_file_path = "/var/lib/tox-bootstrapd/keys"
pid_file_path = "/var/run/tox-bootstrapd/tox-bootstrapd.pid"

enable_ipv6 = true
enable_ipv4_fallback = true
enable_lan_discovery = true

// TCP-релей: через него идут сообщения, файлы и звонки, когда UDP недоступен.
// 443 — главный порт: он открыт почти во всех сетях.
enable_tcp_relay = true
tcp_relay_ports = [443, 3389, 33445]

enable_motd = true
motd = "StoykoMessenger relay"

bootstrap_nodes = (
  { address = "144.217.167.73"  port = 33445 public_key = "7E5668E0EE09E19F320AD47902419331FFEE147BB3606769CFBE921A2A2FD34C" },
  { address = "tox1.mf-net.eu"  port = 33445 public_key = "B3E5FA80DC8EBD1149AD2AB35ED8B85BD546DEDE261CA593234C619249419506" },
  { address = "45.32.184.23"    port = 33445 public_key = "81C916A3605724106C2E7487DC72FF2F9EB662EB34C85C0C692D8312B442635C" }
)
