org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Демон Kotlin по умолчанию берёт столько же памяти, сколько Gradle (ещё 4 ГБ) - вместе с R8
# это переполняло память компьютера и Gradle «исчезал» (hs_err_pid*.log). Ограничиваем.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.enableJetifier=false

# Нестабильная сеть: больше повторов и таймауты побольше при скачивании зависимостей
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000
