[versions]
sdk-min = "21"
sdk-target = "35"

ksp = "2.3.6"
android-plugin = "9.0.1"

coroutines = "1.10.2"
# dagger 2.56.x ломает DI-граф этого проекта, держим 2.55.
dagger = "2.55"
espresso = "3.7.0"
lifecycle = "2.9.3"
# Камера «кружков» и историй: CameraX сам учитывает поворот датчика, зеркало и пропорции на любом телефоне.
camerax = "1.4.2"
navigation = "2.9.4"
room = "2.7.2"
# Встроенный Tor - те же артефакты и версии, что у Briar (build.gradle: tor_version, lyrebird_version,
# onionwrapper_version; bramble-android/build.gradle: dont-kill-me-lib). Briar Project, GPLv3/BSD.
briar-tor = "0.4.9.13"
briar-lyrebird = "0.6.2"
briar-onionwrapper = "0.1.7"
briar-dontkillme = "0.2.8"

[plugins]
kotlinKsp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidApplication = { id = "com.android.application", version.ref = "android-plugin" }
androidLibrary = { id = "com.android.library", version.ref = "android-plugin" }

[libraries]
androidx-activity = "androidx.activity:activity:1.10.1" # >=1.11.0 needs compileSdk 36.
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.1"
androidx-core-ktx = "androidx.core:core-ktx:1.16.0" # >=1.17.0 needs compileSdk 36.
androidx-fragment = "androidx.fragment:fragment:1.8.9"

androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-preference = "androidx.preference:preference:1.2.1"
# Встроенный браузер: прокси через встроенный VPN (ProxyController).
androidx-webkit = "androidx.webkit:webkit:1.12.1"

androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

google-android-material = "com.google.android.material:material:1.13.0"
google-dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
google-dagger-core = { module = "com.google.dagger:dagger", version.ref = "dagger" }

javax-inject = "javax.inject:javax.inject:1"

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

nayuki-qrcodegen = "io.nayuki:qrcodegen:1.8.0"
# Распознавание QR встроенным сканером. 3.3.0 - последняя версия, совместимая с Android 5+ без desugaring.
zxing-core = "com.google.zxing:core:3.3.0"
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

square-picasso = "com.squareup.picasso:picasso:2.8"

# «Каналы связи»: Tor. onionwrapper - обёртка запуска/управления Tor от Briar (AndroidTorWrapper,
# мосты obfs4/meek/snowflake по стране); tor-android и lyrebird-android - только бинарники (.so).
briar-onionwrapper-android = { module = "org.briarproject:onionwrapper-android", version.ref = "briar-onionwrapper" }
briar-dontkillme = { module = "org.briarproject:dont-kill-me-lib", version.ref = "briar-dontkillme" }
briar-tor-android = { module = "org.briarproject:tor-android", version.ref = "briar-tor" }
briar-lyrebird-android = { module = "org.briarproject:lyrebird-android", version.ref = "briar-lyrebird" }


test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-junit-ext = "androidx.test.ext:junit:1.3.0"
test-rules = "androidx.test:rules:1.7.0"
test-runner = "androidx.test:runner:1.7.0"

[bundles]
